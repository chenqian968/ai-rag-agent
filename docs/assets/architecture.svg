<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 18px; font-weight: 600; fill: #2C2C2A; }
    .layer-label { font-size: 12px; fill: #5F5E5A; }
    .box-title { font-size: 14px; font-weight: 600; }
    .box-sub { font-size: 11px; }
    .edge { stroke: #888780; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <text class="title" x="440" y="32" text-anchor="middle" fill="#111111">AI 知识库问答 Agent 系统架构</text>

  <!-- 表示层 -->
  <rect x="40" y="55" width="800" height="110" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="layer-label" x="56" y="78">表示层 Presentation</text>
  <g>
    <rect x="70" y="92" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
    <text class="box-title" x="190" y="113" text-anchor="middle" fill="#3C3489">Web 前端</text>
    <text class="box-sub" x="190" y="131" text-anchor="middle" fill="#534AB7">HTML / CSS / JS（上传+对话）</text>
  </g>
  <g>
    <rect x="350" y="92" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
    <text class="box-title" x="470" y="113" text-anchor="middle" fill="#3C3489">命令行 CLI</text>
    <text class="box-sub" x="470" y="131" text-anchor="middle" fill="#534AB7">chat.py / rag.py / agent_cli.py</text>
  </g>

  <line class="edge" x1="440" y1="165" x2="440" y2="195"/>

  <!-- 应用层 -->
  <rect x="40" y="195" width="800" height="110" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="layer-label" x="56" y="218">应用层 Application</text>
  <g>
    <rect x="70" y="232" width="730" height="56" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
    <text class="box-title" x="435" y="253" text-anchor="middle" fill="#0C447C">FastAPI 后端（api.py）</text>
    <text class="box-sub" x="435" y="271" text-anchor="middle" fill="#185FA5">/api/chat · /api/ingest · /api/reset · /api/health</text>
  </g>

  <line class="edge" x1="300" y1="305" x2="300" y2="340"/>
  <line class="edge" x1="580" y1="305" x2="580" y2="340"/>

  <!-- 领域层 -->
  <rect x="40" y="340" width="800" height="120" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="layer-label" x="56" y="363">领域层 Domain（核心能力）</text>
  <g>
    <rect x="70" y="377" width="360" height="66" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
    <text class="box-title" x="250" y="398" text-anchor="middle" fill="#085041">Agent 编排（agent.py）</text>
    <text class="box-sub" x="250" y="416" text-anchor="middle" fill="#0F6E56">LangGraph ReAct 循环 + 工具调用</text>
    <text class="box-sub" x="250" y="430" text-anchor="middle" fill="#0F6E56">search_knowledge · calculate</text>
  </g>
  <g>
    <rect x="460" y="377" width="350" height="66" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
    <text class="box-title" x="635" y="398" text-anchor="middle" fill="#085041">RAG 链路（loader.py / rag.py）</text>
    <text class="box-sub" x="635" y="416" text-anchor="middle" fill="#0F6E56">文档加载 → 分块 → 向量化</text>
    <text class="box-sub" x="635" y="430" text-anchor="middle" fill="#0F6E56">混合检索（语义 + 关键词兜底）</text>
  </g>

  <line class="edge" x1="440" y1="460" x2="440" y2="495"/>

  <!-- 数据层 -->
  <rect x="40" y="495" width="800" height="90" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="layer-label" x="56" y="518">数据层 Data</text>
  <g>
    <rect x="70" y="530" width="300" height="40" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="1"/>
    <text class="box-title" x="220" y="555" text-anchor="middle" fill="#633806">Chroma 向量库（本地持久化）</text>
  </g>
  <g>
    <rect x="400" y="530" width="300" height="40" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="1"/>
    <text class="box-title" x="550" y="555" text-anchor="middle" fill="#633806">Embedding：BAAI/bge-m3（1024 维）</text>
  </g>

  <!-- 外部服务 -->
  <rect x="620" y="55" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1" stroke-dasharray="5,3"/>
  <text class="box-title" x="730" y="77" text-anchor="middle" fill="#712B13">外部服务</text>
  <text class="box-sub" x="730" y="95" text-anchor="middle" fill="#993C1D">DeepSeek / 硅基流动 API</text>

  <path class="edge" d="M620 110 C560 120 560 90 500 100" />
</svg>

<svg viewBox="0 0 680 340" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>RAG 调优的 4 个维度</title>
<desc>数据质量、分块索引、检索策略、排序截断四个维度对应的调优实践</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="340" fill="#ffffff"/>

<text x="40" y="34" font-family="sans-serif" font-size="15" font-weight="500" fill="#26215C">RAG 调优的 4 个维度</text>

<g>
<rect x="40" y="52" width="135" height="64" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="107" y="76" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">数据</text>
<text x="107" y="96" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">剔除问题清单污染</text>
</g>

<line x1="175" y1="84" x2="205" y2="84" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="205" y="52" width="135" height="64" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="272" y="76" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">索引 · 分块</text>
<text x="272" y="96" font-family="sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">匹配文档结构切分</text>
</g>

<line x1="340" y1="84" x2="370" y2="84" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="370" y="52" width="135" height="64" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="437" y="76" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">检索</text>
<text x="437" y="96" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">语义 + 关键词混合</text>
</g>

<line x1="505" y1="84" x2="535" y2="84" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="535" y="52" width="105" height="64" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="587" y="76" font-family="sans-serif" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">排序 · 截断</text>
<text x="587" y="96" font-family="sans-serif" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">命中块优先置前</text>
</g>

<text x="40" y="150" font-family="sans-serif" font-size="13" font-weight="500" fill="#26215C">每个维度的具体实践</text>

<g>
<rect x="40" y="166" width="135" height="118" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="107" y="188" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">坑一</text>
<text x="107" y="210" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">语料只放有答案</text>
<text x="107" y="226" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">价值的正文</text>
<text x="107" y="248" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">剔除目录、免责</text>
<text x="107" y="264" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">声明等干扰项</text>
</g>

<g>
<rect x="205" y="166" width="135" height="118" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="272" y="188" font-family="sans-serif" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">坑三</text>
<text x="272" y="210" font-family="sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">条目式按条目边界切</text>
<text x="272" y="226" font-family="sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">chunk_size=300 为</text>
<text x="272" y="242" font-family="sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">甜点值,太大稀释</text>
<text x="272" y="258" font-family="sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">太小切碎</text>
</g>

<g>
<rect x="370" y="166" width="135" height="118" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="437" y="188" font-family="sans-serif" font-size="12" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">坑二</text>
<text x="437" y="210" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">向量检索对术语缩写</text>
<text x="437" y="226" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">召回不足,加关键词</text>
<text x="437" y="242" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">字面匹配兜底</text>
<text x="437" y="258" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">(混合检索)</text>
</g>

<g>
<rect x="535" y="166" width="105" height="118" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="587" y="188" font-family="sans-serif" font-size="12" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">坑四</text>
<text x="587" y="210" font-family="sans-serif" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">召回 ≠ 排序</text>
<text x="587" y="226" font-family="sans-serif" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">命中块置前</text>
<text x="587" y="242" font-family="sans-serif" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">避免被 top_k</text>
<text x="587" y="258" font-family="sans-serif" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">截断吞掉</text>
</g>

<text x="40" y="312" font-family="sans-serif" font-size="12" fill="#5F5E5A">最终结果:9 个测试问题全部正确,含风控场景(拒绝推荐个股)</text>
</svg>
